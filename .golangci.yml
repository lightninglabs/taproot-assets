version: "2"
run:
  build-tags:
    - itest
linters:
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - durationcheck
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - lll
    - makezero
    - nilerr
    - nilnesserr
    - nosprintfhostport
    - reassign
    - rowserrcheck
    - sqlclosecheck
    - tagliatelle
    - testifylint
    - unconvert
    - whitespace
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      disabled-checks:
        - unslice
        - captLocal
        - underef
        - appendAssign
        - exitAfterDefer
    gosec:
      excludes:
        - G306 # Poor file permissions used when writing to a new file.
        - G115 # Integer overflow conversion.
    govet:
      disable:
        - inline
    lll:
      # Max line length, lines longer will be reported.
      line-length: 80
      # Tab width in spaces.
      tab-width: 8
    staticcheck:
      # This list replaces golangci-lint's default check list, whose
      # ST exclusions are repeated here.
      checks:
        - all
        - -SA1019
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1008
    tagliatelle:
      case:
        rules:
          json: snake
    testifylint:
      disable-all: true
      enable:
        - error-is-as
        - go-require
        - require-error
    whitespace:
      multi-if: true
      multi-func: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Exclude gosec from running for tests so that tests with weak randomness
      # (math/rand) will pass the linter.
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - gosec
        path: mock.go
      - linters:
          - gosec
        path: internal/test/.*
      # Fix false positives because of build flags in itest directory.
      - linters:
          - unused
        path: itest/.*
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  new-from-rev: 002f4ac35f343797e0a1a07a505c65a94d9dd4b3
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      # simplify code: gofmt with `-s` option, true by default
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
