name: Backward Compatibility Tests

on:
  # Run on every pull request so cross-version regressions are caught before
  # merge, alongside manual dispatch and release branch pushes.
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOPATH: /home/runner/go

jobs:
  compat-tests:
    name: Compat Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git worktree builds.

      # Private mirrors may not contain the public release tags.
      - name: Fetch historical release
        run: git fetch https://github.com/lightninglabs/taproot-assets.git refs/tags/v0.8.0:refs/tags/v0.8.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache compat binaries
        uses: actions/cache@v4
        with:
          path: ~/.tapd-compat-bins
          key: compat-bins-${{ runner.os }}-${{ runner.arch }}

      - name: Build current integrated binary
        run: make build-itest

      - name: Run backward compatibility tests
        run: make itest-cc-compat
