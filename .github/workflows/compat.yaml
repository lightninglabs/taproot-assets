name: Backward Compatibility Tests

on:
  # Run on every pull request so cross-version regressions are caught before
  # merge, alongside manual dispatch and main and release branch pushes.
  # Caches saved on main are restored by pull requests.
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'release/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOPATH: /home/runner/go

jobs:
  compat-tests:
    name: Compat Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git worktree builds.

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The key changes with the files that list the compat versions. An
      # older cache is restored and binaries for new versions are added.
      - name: Cache compat binaries
        uses: actions/cache@v4
        with:
          path: ~/.tapd-compat-bins
          key: >-
            compat-bins-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('itest/custom_channels/compat_test.go', 'itest/custom_channels/spender_upgrade_test.go') }}
          restore-keys: >-
            compat-bins-${{ runner.os }}-${{ runner.arch }}-

      - name: Build current integrated binary
        run: make build-itest-integrated

      - name: Run backward compatibility tests
        run: make itest-cc-compat
